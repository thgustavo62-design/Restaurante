<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --background:#0A0A0B;
  --surface-01:#101112;
  --surface-02:#151617;
  --surface-03:#1C1D1F;
  --surface-hover:#232426;
  --border:#2A2C2F;
  --text-primary:#F4F2ED;
  --text-secondary:#A8A8A5;
  --text-muted:#707174;
  --primary:#F05A24;
  --primary-hover:#FF6933;
  --primary-dark:#B93D14;
  --success:#2FA84F;
  --warning:#F59E0B;
  --danger:#D83A32;
  --info:#3E7DBE;
  --font-display:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--background); color:var(--text-primary);
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:.3px;}
::selection{background:var(--primary); color:#fff;}

/* ---------- shell ---------- */
#app{height:100vh; display:flex; flex-direction:column;}
.shell{flex:1; display:flex; min-height:0;}
.sidebar{
  width:220px; flex:0 0 220px; background:var(--surface-01); border-right:1px solid var(--border);
  display:flex; flex-direction:column; transition:width .15s ease, flex-basis .15s ease; overflow:hidden;
}
.sidebar.collapsed{width:72px; flex-basis:72px;}
.sidebar-brand{
  display:flex; align-items:center; gap:10px; padding:18px 16px; border-bottom:1px solid var(--border); white-space:nowrap;
}
.sidebar-brand .flame{color:var(--primary); flex:0 0 auto;}
.sidebar-brand .name{font-family:var(--font-display); font-weight:800; font-size:19px; line-height:1;}
.sidebar-brand .sub{font-size:9.5px; color:var(--text-muted); letter-spacing:2px; text-transform:uppercase;}
.sidebar.collapsed .brand-text{display:none;}
.nav-scroll{flex:1; overflow-y:auto; padding:10px 10px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:0; cursor:pointer;
  color:var(--text-secondary); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; margin-bottom:2px;
  border-left:3px solid transparent; min-height:40px;
}
.nav-item svg{flex:0 0 auto;}
.nav-item:hover{background:var(--surface-hover); color:var(--text-primary);}
.nav-item.active{background:var(--surface-03); color:var(--text-primary); border-left-color:var(--primary);}
.nav-item.active svg{color:var(--primary);}
.nav-item.disabled{opacity:.4; cursor:default;}
.nav-item.disabled:hover{background:transparent; color:var(--text-secondary);}
.nav-badge{margin-left:auto; font-size:9px; background:var(--surface-03); color:var(--text-muted); padding:2px 6px; border-radius:4px; letter-spacing:.5px;}
.sidebar.collapsed .nav-label,.sidebar.collapsed .nav-badge{display:none;}
.sidebar-foot{border-top:1px solid var(--border); padding:10px;}

/* ---------- topbar ---------- */
.main-col{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  height:60px; flex:0 0 60px; display:flex; align-items:center; gap:14px; padding:0 18px;
  border-bottom:1px solid var(--border); background:var(--surface-01);
}
.icon-btn{
  background:transparent; border:1px solid var(--border); color:var(--text-secondary); border-radius:4px;
  width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
}
.icon-btn:hover{background:var(--surface-hover); color:var(--text-primary);}
.topbar-title{font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.5px; text-transform:uppercase;}
.status-pill{
  display:flex; align-items:center; gap:7px; font-size:11px; padding:6px 10px; border-radius:3px;
  background:var(--surface-03); border:1px solid var(--border); color:var(--text-secondary); white-space:nowrap;
}
.status-dot{width:7px; height:7px; border-radius:50%; background:var(--success); flex:0 0 auto;}
.topbar-spacer{flex:1;}
.user-chip{display:flex; align-items:center; gap:9px;}
.user-chip .avatar{
  width:32px; height:32px; border-radius:4px; background:var(--surface-03); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--primary);
}
.user-chip .meta{line-height:1.15; display:none;}
.user-chip .meta .nome{font-size:12.5px; font-weight:600;}
.user-chip .meta .papel{font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px;}
@media(min-width:760px){ .user-chip .meta{display:block;} }

/* ---------- content ---------- */
.content{flex:1; overflow-y:auto; padding:20px;}
.page-header{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.page-title{font-size:28px; font-weight:800; text-transform:uppercase; letter-spacing:1px; padding-left:12px; border-left:4px solid var(--primary);}
.page-sub{font-size:12px; color:var(--text-muted); margin-top:2px; padding-left:12px; text-transform:uppercase; letter-spacing:.5px;}
.section-label{font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--text-muted); font-weight:800; margin:22px 0 10px; border-bottom:1px solid var(--border); padding-bottom:8px;}
.section-label:first-child{margin-top:0;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--surface-03); border:1px solid var(--border); color:var(--text-primary);
  padding:0 16px; height:44px; border-radius:4px; cursor:pointer; font-size:12.5px; font-weight:700;
  text-transform:uppercase; letter-spacing:.6px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.btn:hover{background:var(--surface-hover); border-color:#3a3d42;}
.btn:active{transform:translateY(1px); box-shadow:none;}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn-primary{background:var(--primary); border-color:var(--primary-dark); color:#fff; font-weight:800;}
.btn-primary:hover{background:var(--primary-hover);}
.btn-success{background:var(--success); border-color:var(--success); color:#06210c; font-weight:800;}
.btn-danger{background:var(--danger); border-color:var(--danger); color:#fff; font-weight:800;}
.btn-ghost{background:transparent; box-shadow:none;}
.btn-lg{height:52px; font-size:14px; letter-spacing:.8px;}
.btn-block{width:100%;}
.btn-sm{height:32px; padding:0 12px; font-size:11px;}

/* ---------- login ---------- */
.login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px; background:
  radial-gradient(ellipse at 50% -10%, rgba(240,90,36,.12), transparent 60%), var(--background);}
.login-card{width:100%; max-width:440px; background:var(--surface-01); border:1px solid var(--border); border-top:3px solid var(--primary); border-radius:6px; padding:32px; text-align:center;}
.login-flame{color:var(--primary); margin-bottom:6px;}
.login-card h1{font-size:26px; font-weight:800; text-transform:uppercase; letter-spacing:1px;}
.login-card p{margin:6px 0 24px; color:var(--text-muted); font-size:12.5px;}
.user-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.user-card{background:var(--surface-02); border:1px solid var(--border); border-radius:4px; padding:16px 8px; cursor:pointer;}
.user-card:hover{border-color:var(--primary); background:var(--surface-03);}
.user-card .nome{font-size:14px; font-weight:700;}
.user-card .papel{font-size:10.5px; color:var(--text-muted); margin-top:4px; text-transform:uppercase; letter-spacing:.5px;}
.pin-dots{display:flex; gap:14px; justify-content:center; margin:20px 0;}
.pin-dot{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--border);}
.pin-dot.filled{background:var(--primary); border-color:var(--primary);}
.pinpad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:260px; margin:0 auto;}
.pinpad button{min-height:56px; font-size:19px; font-weight:600; background:var(--surface-02); border:1px solid var(--border); color:var(--text-primary); border-radius:4px; cursor:pointer;}
.pinpad button:hover{background:var(--surface-hover);}
.pin-error{color:var(--danger); font-size:12px; min-height:16px; margin-bottom:6px; font-weight:600;}

/* ---------- metric / cards ---------- */
.metric-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.metric-card{background:var(--surface-01); border:1px solid var(--border); border-radius:4px; padding:16px 18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.metric-label{font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:600;}
.metric-value{font-family:var(--font-display); font-size:30px; font-weight:800; margin-top:4px; line-height:1;}
.metric-value.small{font-size:22px;}
.metric-delta{font-size:11px; margin-top:6px; color:var(--text-muted);}

.card{background:var(--surface-01); border:1px solid var(--border); border-radius:4px; padding:18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.02);}
.card-title{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; color:var(--text-secondary); border-bottom:1px solid var(--border); padding-bottom:10px;}
.grid-2{display:grid; grid-template-columns:1fr; gap:14px;}
@media(min-width:900px){ .grid-2{grid-template-columns:1.3fr 1fr;} }

.chart-bars{display:flex; align-items:flex-end; gap:4px; height:110px;}
.chart-bar{flex:1; background:var(--surface-03); border-radius:3px 3px 0 0; position:relative; min-height:2px;}
.chart-bar.has{background:var(--primary);}
.chart-labels{display:flex; gap:4px; margin-top:6px;}
.chart-labels span{flex:1; text-align:center; font-size:9px; color:var(--text-muted);}

.alert-row{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:3px; background:var(--surface-02); border-left:4px solid var(--warning); margin-bottom:8px; font-size:12.5px;}
.alert-row.danger{border-left-color:var(--danger);}
.alert-row .t{font-weight:700; display:block;}
.alert-row .d{color:var(--text-muted); font-size:11.5px;}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.tab{background:var(--surface-01); border:1px solid var(--border); color:var(--text-secondary); padding:8px 14px; border-radius:4px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; white-space:nowrap;}
.tab.active{background:var(--primary); border-color:var(--primary-dark); color:#fff;}

/* ---------- mesas ---------- */
.mesas-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:8px;}
.mesa-block{
  background:var(--surface-01); border:1px solid var(--border); border-radius:4px; padding:12px 10px;
  cursor:pointer; min-height:108px; display:flex; flex-direction:column; justify-content:space-between;
  border-left:5px solid var(--border);
}
.mesa-block:hover{background:var(--surface-hover);}
.mesa-block.livre{border-left-color:var(--success);}
.mesa-block.ocupada{border-left-color:var(--primary);}
.mesa-block.pagamento{border-left-color:var(--danger);}
.mesa-top .num{font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1;}
.mesa-top .label{font-size:9.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;}
.mesa-mid{font-size:11px; color:var(--text-secondary); margin-top:6px;}
.mesa-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:8px;}
.mesa-valor{font-size:12.5px; font-weight:700;}
.mesa-time{font-size:10.5px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:4px;}
.mesa-time.warn{color:var(--warning);}
.mesa-time.danger{color:var(--danger);}
.mesa-status-txt{font-size:10px; color:var(--success); text-transform:uppercase; font-weight:700; letter-spacing:.5px;}

.comandas-side .item{display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--border); cursor:pointer; font-size:12.5px;}
.comandas-side .item:last-child{border-bottom:none;}
.comandas-side .item:hover{color:var(--primary);}
.comandas-side .item .t{color:var(--text-muted); font-size:10.5px;}

/* ---------- comanda / split ---------- */
.comanda-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;}
.comanda-head .titulo{font-family:var(--font-display); font-size:22px; font-weight:800;}
.comanda-head .sub{font-size:11.5px; color:var(--text-muted);}
.split{display:flex; flex-direction:column; gap:16px;}
.split-main{display:none;}
.split-side{display:block;}
.split.mobile-catalog .split-main{display:block;}
.split.mobile-catalog .split-side{display:none;}
@media(min-width:1000px){
  .split{flex-direction:row; align-items:flex-start;}
  .split-main{flex:1 1 62%; display:block !important;}
  .split-side{flex:0 0 360px; position:sticky; top:0; display:block !important;}
}
.mobile-only{display:block;}
@media(min-width:1000px){ .mobile-only{display:none;} }

.search-box{position:relative; margin-bottom:12px;}
.search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted);}
.search-box input{width:100%; height:44px; padding:0 14px 0 38px; background:var(--surface-01); border:1px solid var(--border); border-radius:4px; color:var(--text-primary); font-size:13.5px;}
.search-box input:focus{outline:none; border-color:var(--primary);}

.product-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px;}
.product-card{background:var(--surface-01); border:1px solid var(--border); border-radius:4px; padding:14px 12px; cursor:pointer; text-align:left;}
.product-card:hover{border-color:var(--primary);}
.product-card .nome{font-size:12.5px; font-weight:600; line-height:1.3; min-height:32px;}
.product-card .preco{font-family:var(--font-display); font-size:17px; font-weight:800; color:var(--primary); margin-top:8px;}

.order-panel{background:var(--surface-01); border:1px solid var(--border); border-radius:4px; padding:16px; display:flex; flex-direction:column; gap:14px;}
.order-panel-title{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary);}
.draft-line{background:var(--surface-02); border:1px solid var(--border); border-radius:4px; padding:10px; margin-bottom:8px;}
.draft-line-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
.draft-line .nome{font-size:13px; font-weight:600;}
.qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-ctrl button{width:28px; height:28px; border-radius:3px; border:1px solid var(--border); background:var(--surface-03); color:var(--text-primary); cursor:pointer; font-size:15px; display:flex; align-items:center; justify-content:center;}
.qty-ctrl span{min-width:16px; text-align:center; font-weight:700; font-size:13px;}
.draft-line .obs-input{width:100%; margin-top:8px; background:var(--surface-03); border:1px solid var(--border); border-radius:3px; color:var(--text-primary); font-size:11.5px; padding:6px 8px;}

.item-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border); font-size:12.5px;}
.item-row:last-child{border-bottom:none;}
.item-row .info{flex:1;}
.item-row .nome{font-weight:600;}
.item-row .obs{color:var(--warning); font-size:10.5px; text-transform:uppercase; letter-spacing:.3px;}
.item-row .meta{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.item-row .preco{font-weight:700; white-space:nowrap; font-size:12.5px;}

.status-badge{font-size:9.5px; padding:3px 7px; border-radius:5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; display:inline-block;}
.status-PENDENTE{background:rgba(216,58,50,.15); color:var(--danger);}
.status-PREPARANDO{background:rgba(245,158,11,.15); color:var(--warning);}
.status-PRONTO{background:rgba(47,168,79,.15); color:var(--success);}
.status-ENTREGUE{background:var(--surface-03); color:var(--text-muted);}
.status-CANCELADO{background:rgba(216,58,50,.15); color:var(--danger); text-decoration:line-through;}

.totais-box{border-top:1px solid var(--border); padding-top:10px; margin-top:4px;}
.totais-linha{display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); padding:3px 0;}
.totais-linha.total{font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--text-primary); border-top:1px solid var(--border); margin-top:6px; padding-top:8px;}
.action-row{display:flex; gap:10px; margin-top:6px; flex-wrap:wrap;}
.fab{position:fixed; right:20px; bottom:76px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; border:none; cursor:pointer; box-shadow:0 8px 24px rgba(0,0,0,.5); z-index:30; display:flex; align-items:center; justify-content:center;}
@media(min-width:1000px){ .fab{display:none;} }

/* ---------- KDS kanban ---------- */
.kanban{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; align-items:start;}
.kanban-col{background:var(--surface-02); border:1px solid var(--border); border-radius:4px; padding:12px; min-height:120px;}
.kanban-col.drag-over{border-color:var(--primary); background:var(--surface-hover);}
.kanban-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:0 2px;}
.kanban-col-head .t{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-secondary);}
.kanban-col-head .n{font-size:11px; color:var(--text-muted); background:var(--surface-03); padding:2px 7px; border-radius:10px;}
.kanban-card{background:var(--surface-01); border:1px solid var(--border); border-left:4px solid var(--border); border-radius:4px; padding:12px; margin-bottom:10px; cursor:grab;}
.kanban-card.dragging{opacity:.4;}
.kanban-card.col-PENDENTE{border-left-color:var(--danger);}
.kanban-card.col-PREPARANDO{border-left-color:var(--warning);}
.kanban-card.col-PRONTO{border-left-color:var(--success);}
.kanban-card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;}
.kanban-card .codigo{font-size:11px; color:var(--text-muted); font-weight:700;}
.kanban-card .mesa{font-size:12px; color:var(--text-secondary); margin-bottom:6px;}
.kanban-card .produto{font-family:var(--font-display); font-size:16px; font-weight:700; line-height:1.25;}
.kanban-card .obs{font-size:10.5px; color:var(--warning); text-transform:uppercase; font-weight:700; margin-top:2px;}
.kanban-card .garcom{font-size:10.5px; color:var(--text-muted); margin-top:8px;}
.kanban-card .tempo{font-size:11px; font-weight:700; color:var(--text-muted); display:flex; align-items:center; gap:4px;}
.kanban-card .tempo.atraso{color:var(--danger);}

/* ---------- caixa ---------- */
.caixa-status-card{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
.caixa-status-card .left .t{font-family:var(--font-display); font-size:20px; font-weight:800;}
.caixa-status-card .left .d{font-size:11.5px; color:var(--text-muted); margin-top:2px;}
.shortcut-hint{display:flex; gap:14px; flex-wrap:wrap; font-size:10.5px; color:var(--text-muted); margin-top:14px;}
.shortcut-hint kbd{background:var(--surface-03); border:1px solid var(--border); border-radius:4px; padding:1px 6px; font-size:10px; color:var(--text-secondary);}
.mov-row{display:flex; justify-content:space-between; align-items:center; padding:9px 2px; border-bottom:1px solid var(--border); font-size:12.5px;}
.mov-row:last-child{border-bottom:none;}
.mov-row .tag{font-size:10px; color:var(--text-muted); margin-top:2px;}
.mov-tipo{font-size:9.5px; font-weight:700; padding:2px 6px; border-radius:5px; text-transform:uppercase; margin-right:6px;}
.mov-tipo.VENDA{background:rgba(47,168,79,.15); color:var(--success);}
.mov-tipo.SANGRIA{background:rgba(216,58,50,.15); color:var(--danger);}
.mov-tipo.SUPRIMENTO{background:rgba(62,125,190,.15); color:var(--info);}
.mov-tipo.ENTRADA{background:rgba(47,168,79,.15); color:var(--success);}
.mov-tipo.SAIDA{background:rgba(216,58,50,.15); color:var(--danger);}

/* ---------- listas de gestão (cardápio / estoque / financeiro / equipe) ---------- */
.data-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border); font-size:12.5px;}
.data-row:last-child{border-bottom:none;}
.data-row .main{flex:1; min-width:0;}
.data-row .main .nome{font-weight:700; font-size:13px;}
.data-row .main .sub{font-size:11px; color:var(--text-muted); margin-top:2px;}
.data-row .num{font-weight:700; white-space:nowrap; text-align:right;}
.data-row .acts{display:flex; gap:6px; flex:0 0 auto;}
.badge{font-size:9.5px; padding:3px 7px; border-radius:3px; text-transform:uppercase; letter-spacing:.5px; font-weight:800; display:inline-block; white-space:nowrap;}
.badge-ok{background:rgba(47,168,79,.15); color:var(--success);}
.badge-baixo{background:rgba(216,58,50,.15); color:var(--danger);}
.badge-esgotado{background:rgba(216,58,50,.15); color:var(--danger);}
.badge-inativo{background:var(--surface-03); color:var(--text-muted);}
.badge-pago{background:rgba(47,168,79,.15); color:var(--success);}
.badge-vencido{background:rgba(216,58,50,.15); color:var(--danger);}
.badge-pendente{background:rgba(245,158,11,.15); color:var(--warning);}
.stock-bar{height:5px; background:var(--surface-03); border-radius:2px; margin-top:6px; overflow:hidden; width:100%; max-width:180px;}
.stock-bar-fill{height:100%; background:var(--success);}
.stock-bar-fill.low{background:var(--danger);}
.ranking-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border); font-size:12.5px;}
.ranking-row:last-child{border-bottom:none;}
.ranking-row .pos{font-family:var(--font-display); font-size:20px; font-weight:800; color:var(--text-muted); width:28px; flex:0 0 auto;}
.filter-row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px;}
.filter-row .field{margin-bottom:0; min-width:160px;}

/* ---------- forms ---------- */
.field{margin-bottom:14px; text-align:left;}
.field label{display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
.field input, .field select, .field textarea{
  width:100%; background:var(--surface-02); border:1px solid var(--border); color:var(--text-primary);
  padding:0 14px; height:44px; border-radius:4px; font-size:14px;
}
.field textarea{padding:10px 14px; min-height:70px; resize:vertical; height:auto;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--primary);}

/* ---------- modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(0,0,0,.7); display:flex; align-items:flex-end; justify-content:center; z-index:100; padding:0;}
@media(min-width:640px){ .modal-overlay{align-items:center; padding:20px;} }
.modal-box{background:var(--surface-01); border:1px solid var(--border); border-top:3px solid var(--primary); border-radius:8px 8px 0 0; width:100%; max-width:520px; max-height:90vh; overflow-y:auto; padding:22px;}
@media(min-width:640px){ .modal-box{border-radius:6px; border-top:3px solid var(--primary);} }
.modal-box h2{font-size:19px; font-weight:800; text-transform:uppercase;}
.modal-sub{font-size:12px; color:var(--text-muted); margin-top:4px; margin-bottom:18px;}
.modal-highlight{background:var(--surface-02); border:1px solid var(--border); border-left:3px solid var(--primary); border-radius:3px; padding:12px 14px; margin-bottom:16px; font-size:13px;}

.cat-tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:12px;}
.cat-tab{background:var(--surface-02); border:1px solid var(--border); color:var(--text-secondary); padding:7px 13px; border-radius:3px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; cursor:pointer; white-space:nowrap;}
.cat-tab.active{background:var(--primary); border-color:var(--primary-dark); color:#fff;}

.pay-methods{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;}
@media(min-width:480px){ .pay-methods{grid-template-columns:repeat(3,1fr);} }
.pay-method-btn{background:var(--surface-02); border:1px solid var(--border); color:var(--text-primary); border-radius:4px; height:56px; font-size:12px; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.5px;}
.pay-method-btn:hover{border-color:var(--primary); color:var(--primary);}
.pagamento-linha{display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--surface-02); border:1px solid var(--border); border-radius:3px; margin-bottom:8px;}
.pagamento-linha .forma{font-size:11.5px; font-weight:700; text-transform:uppercase; color:var(--text-secondary); flex:0 0 auto; width:80px;}
.pagamento-linha input{flex:1; background:var(--surface-03); border:1px solid var(--border); color:var(--text-primary); height:34px; border-radius:3px; padding:0 8px; font-size:13px;}

.recon-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.recon-table th{text-align:right; font-size:10px; text-transform:uppercase; color:var(--text-muted); padding:6px 8px; font-weight:600;}
.recon-table th:first-child,.recon-table td:first-child{text-align:left;}
.recon-table td{text-align:right; padding:8px; border-top:1px solid var(--border);}
.recon-table td.pos{color:var(--warning); font-weight:700;}
.recon-table td.neg{color:var(--danger); font-weight:700;}
.recon-table td.zero{color:var(--success); font-weight:700;}

.diff-box{text-align:center; padding:18px; border-radius:4px; margin:14px 0;}
.diff-box .lbl{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted);}
.diff-box .valor{font-family:var(--font-display); font-size:30px; font-weight:800; margin-top:4px;}
.diff-box.zero{background:rgba(47,168,79,.1); border:1px solid var(--success);} .diff-box.zero .valor{color:var(--success);}
.diff-box.pos{background:rgba(245,158,11,.1); border:1px solid var(--warning);} .diff-box.pos .valor{color:var(--warning);}
.diff-box.neg{background:rgba(216,58,50,.1); border:1px solid var(--danger);} .diff-box.neg .valor{color:var(--danger);}

.empty-hint{color:var(--text-muted); font-size:13px; text-align:center; padding:36px 12px;}

.toast-wrap{position:fixed; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:200; max-width:320px;}

function load(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var s = JSON.parse(raw);
      s.modal = null; s.toasts = s.toasts||[]; s.draft = null;
      return s;
    }
  }catch(e){}
  return seed();
}
function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function usuarioAtual(){
  return state.usuarios.find(function(u){ return u.id===state.usuarioAtualId; });
}
function can(permissao){
  var u = usuarioAtual();
  if(!u) return false;
  var lista = MATRIZ[u.papel] || [];
  return lista.indexOf(permissao) !== -1;
}
function findSupervisor(pin, permissaoNecessaria){

function comandasAbertasDaMesa(mesaId){
  return state.comandas.filter(function(c){ return c.mesaId===mesaId && c.status!=="PAGA"; });
}
function mesaStatus(mesaId){
  var abertas = comandasAbertasDaMesa(mesaId);
  if(abertas.length===0) return "livre";
  if(abertas.some(function(c){ return c.status==="FECHANDO"; })) return "pagamento";
  return "ocupada";
}
function mesaMinutos(mesaId){
  var abertas = comandasAbertasDaMesa(mesaId);
  if(!abertas.length) return 0;
  var min = abertas.map(function(c){ return minutosDesde(c.abertura); });
  return Math.max.apply(null, min);
}
function totaisComanda(comanda){
  var subtotal = 0;
  comanda.itens.forEach(function(it){
    if(it.status==="CANCELADO") return;
    subtotal += it.precoUnitCentavos * it.quantidade;
  });
  var desconto = comanda.descontoCentavos || 0;
  var taxaPct = comanda.taxaServicoAtiva ? state.config.taxaServicoPctPadrao : 0;
  var taxa = Math.round((subtotal - desconto) * taxaPct / 100);
  var total = subtotal - desconto + taxa;
  return {subtotal:subtotal, desconto:desconto, taxaPct:taxaPct, taxa:taxa, total:Math.max(0,total)};
}

function supervisorDigit(d){
  var m = state.modal;
  if(m.buffer.length>=PIN_LEN) return;
  m.buffer += d;
  if(m.buffer.length===PIN_LEN){
    var sup = findSupervisor(m.buffer, m.permissao);
    if(sup){
      var cb = m.onConfirm;
      state.modal = null;
      cb(sup);
    } else {
      m.buffer = ""; m.error = "PIN inválido ou sem permissão.";
    }
  }
  render();
}

function cancelarItemDigit(d){
  var m = state.modal;
  if(!m.motivo.trim()){ m.error = "Informe o motivo antes do PIN."; render(); return; }
  if(m.buffer.length>=PIN_LEN) return;
  m.error = "";
  m.buffer += d;
  if(m.buffer.length===PIN_LEN){
    var sup = findSupervisor(m.buffer, PERM.ITEM_CANCELAR);
    if(sup){
      var comanda = state.comandas.find(function(c){ return c.id===m.comandaId; });

      m.buffer=""; m.error = "PIN inválido ou sem permissão.";

    }
  } else render();

function aplicarDesconto(comandaId, percentInformado){
  var comanda = state.comandas.find(function(c){ return c.id===comandaId; });
  var t = totaisComanda(comanda);
  var descontoCentavos = Math.round((t.subtotal) * percentInformado / 100);
  function aplicar(){
    comanda.descontoCentavos = descontoCentavos;
    state.modal = null;
    save(); render();
  }
  if(percentInformado > limiteDescontoPct()){
    pedirSupervisor(PERM.DESCONTO_APLICAR, "Desconto de "+percentInformado+"% acima do limite de "+limiteDescontoPct()+"%", function(supervisor){
      registrarAuditoria("comandas", comandaId, "DESCONTO_ACIMA_LIMITE", supervisor.id, percentInformado+"% aprovado por "+supervisor.nome);
      aplicar();
    });
  } else {
    aplicar();
  }
}

function confirmarPagamento(){
  if(!state.caixaSessao || state.caixaSessao.status!=="ABERTA"){
    state.modal.erro = "Abra o caixa antes de registrar pagamentos.";
    render(); return;
  }
  var comanda = state.comandas.find(function(c){ return c.id===state.modal.comandaId; });
  var t = totaisComanda(comanda);
  var soma = state.modal.linhas.reduce(function(s,l){ return s+l.valorCentavos; },0);
  if(soma < t.total){
    state.modal.erro = "Faltam "+brl(t.total-soma)+" para cobrir o total.";
    render(); return;
  }
  var troco = soma - t.total;
  comanda.pagamentos = state.modal.linhas.map(function(l){ return {forma:l.forma, valorCentavos:l.valorCentavos}; });
  comanda.trocoCentavos = troco;
  comanda.status = "PAGA";
  comanda.fechamento = new Date().toISOString();
  baixarEstoqueDaVenda(comanda);

  state.modal.linhas.forEach(function(l){
    var valor = l.valorCentavos;
    if(l.forma==="DINHEIRO" && troco>0){ valor = Math.max(0, valor - troco); troco = 0; }
    if(valor<=0) return;
    state.caixaMovimentos.push({
      id:uid("mov"), sessaoId:state.caixaSessao.id, tipo:"VENDA",
      valorCentavos:valor, formaPagamento:l.forma, comandaId:comanda.id,
      usuarioId:state.usuarioAtualId, createdAt:new Date().toISOString()
    });
  });

  state.modal = null;
  state.view = "salao"; state.viewParams = {};
  save(); render();
  toast("ok","PAGAMENTO CONFIRMADO", comanda.codigo+" · "+brl(t.total));
}

function movimentosDaSessao(){
  if(!state.caixaSessao) return [];
  return state.caixaMovimentos.filter(function(m){ return m.sessaoId===state.caixaSessao.id; });
}
function totaisPorForma(){
  var mapa = {};
  movimentosDaSessao().forEach(function(m){
    if(m.tipo!=="VENDA") return;
    mapa[m.formaPagamento] = (mapa[m.formaPagamento]||0) + m.valorCentavos;
  });
  return mapa;
}
function saldoDinheiroEsperado(){
  var s = state.caixaSessao.saldoInicialCentavos;
  movimentosDaSessao().forEach(function(m){
    if(m.tipo==="VENDA" && m.formaPagamento==="DINHEIRO") s += m.valorCentavos;
    if(m.tipo==="SUPRIMENTO") s += m.valorCentavos;
    if(m.tipo==="SANGRIA") s -= m.valorCentavos;
  });
  return s;
}
function formasDaSessao(){
  var formas = Object.keys(totaisPorForma());
  if(formas.indexOf("DINHEIRO")===-1) formas.unshift("DINHEIRO");
  else { formas = formas.filter(function(f){ return f!=="DINHEIRO"; }); formas.unshift("DINHEIRO"); }
  return formas;
}
function esperadoPorForma(forma){
  if(forma==="DINHEIRO") return saldoDinheiroEsperado();
  return totaisPorForma()[forma] || 0;
}
function confirmarFechamento(justificativa){
  var informados = state.modal.informados;
  var esperados = {}; var diffs = {};
  formasDaSessao().forEach(function(f){
    esperados[f] = esperadoPorForma(f);
    diffs[f] = (informados[f]||0) - esperados[f];
  });
  var diferencaDinheiro = diffs.DINHEIRO||0;
  if(Math.abs(diferencaDinheiro) > limiteDiferencaCentavos() && !justificativa){
    render(); return;
  }
  state.caixaSessao.status = "FECHADA";
  state.caixaSessao.fechamentoEm = new Date().toISOString();
  state.caixaSessao.usuarioFechamento = state.usuarioAtualId;
  state.caixaSessao.saldoCalculadoCentavos = esperados.DINHEIRO;
  state.caixaSessao.saldoInformadoCentavos = informados.DINHEIRO||0;
  state.caixaSessao.diferencaCentavos = diferencaDinheiro;
  state.caixaSessao.fechamentoDetalhe = {esperados:esperados, informados:informados, diffs:diffs};
  if(justificativa){
    registrarAuditoria("caixa_sessoes", state.caixaSessao.id, "DIFERENCA_JUSTIFICADA", state.usuarioAtualId, justificativa);
  }
  state.modal = null;
  save(); render();
  toast(diferencaDinheiro===0?"ok":"err","CAIXA FECHADO", "Diferença "+brl(diferencaDinheiro));
}

function confirmarInsumoMov(tipo, insumoId, quantidade, motivo){
  if(!(quantidade>0) || !motivo.trim()) return;
  var insumo = state.insumos.find(function(i){ return i.id===insumoId; });
  if(tipo==="ENTRADA") insumo.estoqueAtual += quantidade;
  else insumo.estoqueAtual = Math.max(0, insumo.estoqueAtual - quantidade);
  state.estoqueMovimentos.push({id:uid("est"), insumoId:insumoId, tipo:tipo, quantidade:quantidade,
    motivo:motivo.trim(), origem:"MANUAL", usuarioId:state.usuarioAtualId, createdAt:new Date().toISOString()});
  state.modal = null;
  save(); render();
  toast("ok", tipo==="ENTRADA"?"ENTRADA REGISTRADA":"SAÍDA REGISTRADA", insumo.nome+" — "+quantidade+" "+insumo.unidade);
}
function baixarEstoqueDaVenda(comanda){
  comanda.itens.forEach(function(it){
    if(it.status==="CANCELADO") return;
    state.fichaTecnica.filter(function(f){ return f.produtoId===it.produtoId; }).forEach(function(f){
      var insumo = state.insumos.find(function(i){ return i.id===f.insumoId; });
      if(!insumo) return;
      var qtd = f.quantidade * it.quantidade;
      insumo.estoqueAtual = Math.max(0, insumo.estoqueAtual - qtd);
      state.estoqueMovimentos.push({id:uid("est"), insumoId:insumo.id, tipo:"VENDA", quantidade:qtd,
        motivo:null, origem:"comanda", origemId:comanda.id, usuarioId:state.usuarioAtualId, createdAt:new Date().toISOString()});
    });
  });
}

function salvarConfig(nome, cnpj, taxaPct, descontoPct, diferencaCentavos){
  state.config.empresaNome = nome.trim() || state.config.empresaNome;
  state.config.empresaCnpj = cnpj.trim();
  state.config.taxaServicoPctPadrao = Math.max(0, taxaPct||0);
  state.config.limiteDescontoPct = Math.max(0, descontoPct||0);
  state.config.limiteDiferencaCentavos = Math.max(0, diferencaCentavos||0);
  save(); render();
  toast("ok","CONFIGURAÇÕES SALVAS", "");
}

// ---------- dashboard helpers ----------
function hojeStr(){ return new Date().toDateString(); }
function comandasPagasHoje(){
  return state.comandas.filter(function(c){
    return c.status==="PAGA" && c.fechamento && new Date(c.fechamento).toDateString()===hojeStr();
  });
}
function itensKdsAtivos(){
  var out = {PENDENTE:0, PREPARANDO:0, PRONTO:0};
  state.comandas.filter(function(c){ return c.status!=="PAGA"; }).forEach(function(c){
    c.itens.forEach(function(it){ if(out[it.status]!==undefined) out[it.status]++; });
  });
  return out;
}

function render(){

  var activeId = (active && active.id) ? active.id : null;
  var selStart = (active && typeof active.selectionStart === "number") ? active.selectionStart : null;
  var selEnd = (active && typeof active.selectionEnd === "number") ? active.selectionEnd : null;

    app.innerHTML = renderLogin();
    bindEvents();
    return;
  }
  var html = '<div class="shell">'+
      renderSidebar()+
      '<div class="main-col">'+
        renderTopbar()+
        '<div class="content">'+renderView()+'</div>'+
        renderBottomNav()+
      '</div>'+

  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart!==null && el.setSelectionRange){
        try{ el.setSelectionRange(selStart, selEnd); }catch(e){}
      }

}

function renderDashboard(){
  var u = usuarioAtual();
  var pagas = comandasPagasHoje();
  var vendasHoje = pagas.reduce(function(s,c){ return s+totaisComanda(c).total; },0);
  var nPedidos = pagas.length;
  var ticketMedio = nPedidos? Math.round(vendasHoje/nPedidos) : 0;
  var ocupadas = state.mesas.filter(function(m){ return mesaStatus(m.id)!=="livre"; }).length;

  var porHora = {};
  pagas.forEach(function(c){
    var h = new Date(c.fechamento).getHours();
    porHora[h] = (porHora[h]||0) + totaisComanda(c).total;
  });
  var horas = []; for(var h=11; h<=23; h++) horas.push(h);
  var maxHora = Math.max(1, Math.max.apply(null, horas.map(function(h){ return porHora[h]||0; })));

  var livres = state.mesas.filter(function(m){ return mesaStatus(m.id)==="livre"; }).length;
  var ocup = state.mesas.filter(function(m){ return mesaStatus(m.id)==="ocupada"; }).length;
  var aguardando = state.mesas.filter(function(m){ return mesaStatus(m.id)==="pagamento"; }).length;

  var kds = itensKdsAtivos();

  var alerts = [];
  state.mesas.forEach(function(m){
    var min = mesaMinutos(m.id);
    if(mesaStatus(m.id)!=="livre" && min>=60) alerts.push({t:"MESA ATRASADA", d:"Mesa "+m.numero+" · "+fmtMin(min), danger:true});
  });
  if(!state.caixaSessao || state.caixaSessao.status!=="ABERTA"){
    alerts.push({t:"CAIXA FECHADO", d:"Abra o caixa para registrar pagamentos"});
  }
  var ultimaFechada = state.caixaSessao && state.caixaSessao.status==="FECHADA" ? state.caixaSessao : null;
  if(ultimaFechada && ultimaFechada.diferencaCentavos){
    alerts.push({t:"DIFERENÇA NO ÚLTIMO CAIXA", d:brl(ultimaFechada.diferencaCentavos), danger:Math.abs(ultimaFechada.diferencaCentavos)>limiteDiferencaCentavos()});
  }

  return '<div class="page-header"><div><div class="page-title">Bom dia, '+escapeHtml(u.nome).toUpperCase()+'</div>'+
      '<div class="page-sub">Operação de hoje · '+new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase()+'</div></div>'+
    '</div>'+
    '<div class="metric-grid">'+
      '<div class="metric-card"><div class="metric-label">Vendas hoje</div><div class="metric-value">'+brl(vendasHoje)+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">Pedidos</div><div class="metric-value">'+nPedidos+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">Ticket médio</div><div class="metric-value">'+brl(ticketMedio)+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">Mesas ocupadas</div><div class="metric-value">'+ocupadas+' / '+state.mesas.length+'</div></div>'+
    '</div>'+
    '<div class="section-label">Vendas do dia</div>'+
    '<div class="card">'+
      '<div class="chart-bars">'+horas.map(function(h){
        var v = porHora[h]||0;
        var pct = Math.max(2, Math.round(v/maxHora*100));
        return '<div class="chart-bar '+(v>0?"has":"")+'" style="height:'+pct+'%" title="'+h+'h · '+brl(v)+'"></div>';
      }).join("")+'</div>'+
      '<div class="chart-labels">'+horas.map(function(h){ return '<span>'+h+'</span>'; }).join("")+'</div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="card">'+
        '<div class="card-title">Situação do salão</div>'+
        '<div class="metric-grid">'+
          '<div class="metric-card"><div class="metric-label">Livres</div><div class="metric-value small" style="color:var(--success);">'+livres+'</div></div>'+
          '<div class="metric-card"><div class="metric-label">Ocupadas</div><div class="metric-value small" style="color:var(--primary);">'+ocup+'</div></div>'+
          '<div class="metric-card"><div class="metric-label">Aguardando conta</div><div class="metric-value small" style="color:var(--danger);">'+aguardando+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="card">'+
        '<div class="card-title">Cozinha agora</div>'+
        '<div class="metric-grid">'+
          '<div class="metric-card"><div class="metric-label">Pendentes</div><div class="metric-value small" style="color:var(--danger);">'+kds.PENDENTE+'</div></div>'+
          '<div class="metric-card"><div class="metric-label">Preparando</div><div class="metric-value small" style="color:var(--warning);">'+kds.PREPARANDO+'</div></div>'+
          '<div class="metric-card"><div class="metric-label">Prontos</div><div class="metric-value small" style="color:var(--success);">'+kds.PRONTO+'</div></div>'+
        '</div>'+
      '</div>'+
    '</div>'+

    (alerts.length ? alerts.map(function(a){
      return '<div class="alert-row '+(a.danger?"danger":"")+'">'+icon("alert",16)+'<div><span class="t">'+a.t+'</span><span class="d">'+a.d+'</span></div></div>';
    }).join("") : '<div class="empty-hint">Nenhum alerta no momento.</div>');

function renderKds(){
  var cols = [["PENDENTE","Pendente","INICIAR PREPARO"],["PREPARANDO","Preparando","MARCAR PRONTO"],["PRONTO","Pronto","ENTREGUE"]];
  var nextStatus = {PENDENTE:"PREPARANDO", PREPARANDO:"PRONTO", PRONTO:"ENTREGUE"};
  var abertas = state.comandas.filter(function(c){ return c.status!=="PAGA"; });
  var cards = {PENDENTE:[], PREPARANDO:[], PRONTO:[]};
  abertas.forEach(function(c){
    var mesa = state.mesas.find(function(m){ return m.id===c.mesaId; });
    c.itens.forEach(function(it){
      if(cards[it.status]) cards[it.status].push({comandaId:c.id, codigo:c.codigo, item:it, mesaNum:mesa?mesa.numero:"?"});
    });
  });
  var total = cards.PENDENTE.length+cards.PREPARANDO.length+cards.PRONTO.length;

  return '<div class="page-header"><div><div class="page-title">Cozinha</div><div class="page-sub">'+total+' pedidos ativos</div></div></div>'+
    '<div class="kanban">'+
    cols.map(function(col){
      var status = col[0], lista = cards[status];
      return '<div class="kanban-col" data-status="'+status+'">'+
        '<div class="kanban-col-head"><span class="t">'+col[1]+'</span><span class="n">'+lista.length+'</span></div>'+

            '<div class="kanban-card-top"><span class="codigo">'+c.codigo+'</span><span class="tempo '+(atraso?"atraso":"")+'">'+icon("clock",11)+' '+fmtMin(min)+'</span></div>'+

            (user?'<div class="garcom">Garçom: '+escapeHtml(user.nome)+'</div>':'')+
            (can(PERM.ITEM_STATUS) ? '<button class="btn '+(status==="PRONTO"?"btn-success":"btn-primary")+' btn-block btn-sm" style="margin-top:10px;" data-action="kds-set" data-comanda="'+c.comandaId+'" data-item="'+c.item.id+'" data-status="'+nextStatus[status]+'">'+col[2]+'</button>' : '')+

function renderRelatorios(){
  var periodo = state.relatorioPeriodo || "HOJE";
  var dias = periodo==="HOJE" ? 0 : periodo==="7D" ? 7 : periodo==="30D" ? 30 : 99999;
  var limite = Date.now() - dias*86400000;
  var pagas = state.comandas.filter(function(c){
    if(c.status!=="PAGA" || !c.fechamento) return false;
    if(periodo==="HOJE") return new Date(c.fechamento).toDateString()===hojeStr();
    return new Date(c.fechamento).getTime()>=limite;
  });
  var totalVendas = pagas.reduce(function(s,c){ return s+totaisComanda(c).total; },0);
  var ticketMedio = pagas.length ? Math.round(totalVendas/pagas.length) : 0;

  var porProduto = {};
  pagas.forEach(function(c){
    c.itens.forEach(function(it){
      if(it.status==="CANCELADO") return;
      if(!porProduto[it.produtoId]) porProduto[it.produtoId] = {nome:it.nome, qtd:0, total:0};
      porProduto[it.produtoId].qtd += it.quantidade;
      porProduto[it.produtoId].total += it.precoUnitCentavos*it.quantidade;
    });
  });
  var ranking = Object.keys(porProduto).map(function(k){ return porProduto[k]; }).sort(function(a,b){ return b.total-a.total; }).slice(0,10);

  var porGarcom = {};
  pagas.forEach(function(c){
    var u = state.usuarios.find(function(x){ return x.id===c.usuarioAbertura; });
    var nome = u ? u.nome : "?";
    if(!porGarcom[nome]) porGarcom[nome] = {nome:nome, vendas:0, contas:0};
    porGarcom[nome].vendas += totaisComanda(c).total;
    porGarcom[nome].contas += 1;
  });
  var garcons = Object.keys(porGarcom).map(function(k){ return porGarcom[k]; }).sort(function(a,b){ return b.vendas-a.vendas; });

  var periodos = [["HOJE","Hoje"],["7D","7 dias"],["30D","30 dias"],["TUDO","Tudo"]];

  return '<div class="page-header"><div><div class="page-title">Relatórios</div><div class="page-sub">Desempenho de vendas</div></div></div>'+
    '<div class="tabs">'+periodos.map(function(p){ return '<div class="tab '+(periodo===p[0]?"active":"")+'" data-action="relatorio-periodo" data-p="'+p[0]+'">'+p[1]+'</div>'; }).join("")+'</div>'+
    '<div class="metric-grid">'+
      '<div class="metric-card"><div class="metric-label">Vendas no período</div><div class="metric-value">'+brl(totalVendas)+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">Contas fechadas</div><div class="metric-value">'+pagas.length+'</div></div>'+
      '<div class="metric-card"><div class="metric-label">Ticket médio</div><div class="metric-value">'+brl(ticketMedio)+'</div></div>'+
    '</div>'+
    '<div class="grid-2">'+
      '<div class="card"><div class="card-title">Ranking de produtos</div>'+
        (ranking.length ? ranking.map(function(r,idx){
          return '<div class="ranking-row"><span class="pos">'+(idx+1)+'</span><div class="main"><div class="nome">'+escapeHtml(r.nome)+'</div><div class="sub">'+r.qtd+' unidades vendidas</div></div><div class="num">'+brl(r.total)+'</div></div>';
        }).join("") : '<div class="empty-hint">Sem vendas no período.</div>')+
      '</div>'+
      '<div class="card"><div class="card-title">Desempenho por garçom</div>'+
        (garcons.length ? garcons.map(function(g){
          return '<div class="data-row"><div class="main"><div class="nome">'+escapeHtml(g.nome)+'</div><div class="sub">'+g.contas+' conta(s) fechada(s)</div></div><div class="num">'+brl(g.vendas)+'</div></div>';
        }).join("") : '<div class="empty-hint">Sem vendas no período.</div>')+
      '</div>'+
    '</div>';
}

function pinPadHtml(buffer, actionDigit, actionBack){
  var dots = "";
  for(var i=0;i<PIN_LEN;i++) dots += '<div class="pin-dot '+(i<buffer.length?"filled":"")+'"></div>';
  var keys = ["1","2","3","4","5","6","7","8","9","","0","back"];
  return '<div class="pin-dots">'+dots+'</div>'+
    '<div class="pinpad">'+keys.map(function(k){
      if(k==="") return '<span></span>';
      if(k==="back") return '<button data-action="'+actionBack+'">'+icon("arrowLeft",16)+'</button>';
      return '<button data-action="'+actionDigit+'" data-d="'+k+'">'+k+'</button>';
    }).join("")+'</div>';
}

function renderCaixaFecharModal(m){
  var formas = formasDaSessao();
  if(!m.stage || m.stage==="contar"){
    return '<div class="modal-overlay"><div class="modal-box">'+
      '<h2>Conferência de caixa</h2><div class="modal-sub">Informe os valores contados. Os valores esperados só aparecem depois de confirmar.</div>'+
      formas.map(function(f){
        return '<div class="field"><label>'+f+'</label><input type="number" min="0" step="0.01" placeholder="0,00" data-action="fechar-informado" data-forma="'+f+'"></div>';
      }).join("")+
      '<div class="action-row">'+
        '<button class="btn btn-ghost" data-action="caixa-fechar-cancelar">Cancelar</button>'+
        '<button class="btn btn-primary btn-block" data-action="caixa-fechar-informar">Conferir caixa</button>'+
      '</div>'+
    '</div></div>';
  }
  var esperados = {}; var diffs = {};
  formas.forEach(function(f){ esperados[f]=esperadoPorForma(f); diffs[f]=(m.informados[f]||0)-esperados[f]; });
  var diferencaDinheiro = diffs.DINHEIRO||0;
  var cls = diferencaDinheiro===0 ? "zero" : (diferencaDinheiro>0 ? "pos" : "neg");
  var precisaJustificar = Math.abs(diferencaDinheiro) > limiteDiferencaCentavos();
  return '<div class="modal-overlay"><div class="modal-box">'+
    '<h2>Resultado do fechamento</h2>'+
    '<div style="overflow-x:auto;"><table class="recon-table"><tr><th></th><th>Esperado</th><th>Informado</th><th>Diferença</th></tr>'+
    formas.map(function(f){
      var d = diffs[f]; var dcls = d===0?"zero":(d>0?"pos":"neg");
      return '<tr><td>'+f+'</td><td>'+brl(esperados[f])+'</td><td>'+brl(m.informados[f]||0)+'</td><td class="'+dcls+'">'+brl(d)+'</td></tr>';
    }).join("")+'</table></div>'+
    '<div class="diff-box '+cls+'"><div class="lbl">Diferença em dinheiro</div><div class="valor">'+brl(diferencaDinheiro)+'</div></div>'+
    (precisaJustificar ?
      '<div class="modal-sub" style="color:var(--danger);">Diferença acima do limite de '+brl(limiteDiferencaCentavos())+'. Justifique para confirmar.</div>'+
      '<div class="field"><label>Justificativa</label><textarea id="justificativaInput" placeholder="Explique a diferença"></textarea></div>'+
      '<div class="action-row">'+
        '<button class="btn btn-ghost" data-action="caixa-fechar-cancelar">Cancelar</button>'+
        '<button class="btn btn-danger btn-block" data-action="caixa-fechar-justificar-confirmar">Confirmar mesmo assim</button>'+
      '</div>'
      :
      '<div class="action-row">'+
        '<button class="btn btn-ghost" data-action="caixa-fechar-cancelar">Cancelar</button>'+
        '<button class="btn btn-primary btn-block" data-action="caixa-fechar-confirmar-final">Confirmar fechamento</button>'+
      '</div>'
    )+
  '</div></div>';
}

// ---------- eventos ----------

function bindEvents(){
  app.onclick = function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.dataset.action;

    if(action==="login-select"){ state.loginSelectedUserId = el.dataset.uid; state.pinError=""; render(); return; }
    if(action==="login-cancel"){ state.loginSelectedUserId = null; state.pinBuffer=""; render(); return; }
    if(action==="login-pin-digit"){
      if(state.pinBuffer.length<PIN_LEN) state.pinBuffer += el.dataset.d;
      if(state.pinBuffer.length===PIN_LEN) login(state.loginSelectedUserId, state.pinBuffer);
      else render();
      return;
    }
    if(action==="login-pin-back"){ state.pinBuffer = state.pinBuffer.slice(0,-1); render(); return; }
    if(action==="logout"){ logout(); return; }
    if(action==="toggle-sidebar"){ state.sidebarCollapsed = !state.sidebarCollapsed; render(); return; }
    if(action==="nav-goto"){ state.view = el.dataset.view; state.viewParams={}; save(); render(); return; }
    if(action==="salao-filtro"){ state.salaoFiltro = el.dataset.f; render(); return; }

    if(action==="mesa-open"){
      var mesaId = el.dataset.mesa;
      var abertas = comandasAbertasDaMesa(mesaId);
      if(abertas.length===0){
        if(can(PERM.COMANDA_ABRIR)) abrirComanda(mesaId);
      } else {
        irParaComanda(abertas[0].id); save(); render();
      }
      return;
    }
    if(action==="comanda-open"){ irParaComanda(el.dataset.comanda); save(); render(); return; }

    if(action==="toggle-mobile-catalog"){ state.draft.mobileCatalog = !state.draft.mobileCatalog; render(); return; }
    if(action==="picker-cat"){ state.draft.categoria = el.dataset.cat; render(); return; }
    if(action==="draft-mais"){ draftAlterar(el.dataset.produto, 1); return; }
    if(action==="draft-menos"){ draftAlterar(el.dataset.produto, -1); return; }
    if(action==="enviar-pedido"){ enviarPedido(); return; }

    if(action==="item-cancelar"){ abrirCancelarItem(state.viewParams.comandaId, el.dataset.item); return; }
    if(action==="cancelaritem-digit"){ cancelarItemDigit(el.dataset.d); return; }
    if(action==="cancelaritem-back"){ state.modal.buffer = state.modal.buffer.slice(0,-1); render(); return; }
    if(action==="cancelaritem-voltar"){ state.modal = null; render(); return; }

    if(action==="desconto-abrir"){ state.modal={type:"desconto", comandaId:state.viewParams.comandaId}; render(); return; }
    if(action==="desconto-cancelar"){ state.modal=null; render(); return; }
    if(action==="desconto-confirmar"){
      var pct = parseFloat(document.getElementById("descontoInput").value||"0");
      if(pct>0) aplicarDesconto(el.dataset.comanda, pct); else { state.modal=null; render(); }
      return;
    }

    if(action==="supervisor-digit"){ supervisorDigit(el.dataset.d); return; }
    if(action==="supervisor-back"){ state.modal.buffer = state.modal.buffer.slice(0,-1); render(); return; }
    if(action==="supervisor-cancel"){ state.modal=null; render(); return; }

    if(action==="fechar-conta-abrir"){ abrirFecharConta(state.viewParams.comandaId); return; }
    if(action==="pagamento-cancelar"){
      var comanda = state.comandas.find(function(c){ return c.id===state.modal.comandaId; });
      comanda.status = "ABERTA";
      state.modal=null; save(); render(); return;
    }
    if(action==="pagamento-metodo"){ pagamentoAddMetodo(el.dataset.forma); return; }
    if(action==="pagamento-remover"){ pagamentoRemoveLinha(parseInt(el.dataset.idx,10)); return; }
    if(action==="pagamento-confirmar"){ confirmarPagamento(); return; }

    if(action==="kds-set"){ kdsSetStatus(el.dataset.comanda, el.dataset.item, el.dataset.status); return; }

    if(action==="caixa-abrir-confirmar"){
      var v = document.getElementById("saldoInicialInput").value;
      abrirCaixa(Math.round(parseFloat(v||"0")*100));
      return;
    }
    if(action==="caixa-mov-abrir"){ state.modal={type:"caixaMov", tipo:el.dataset.tipo}; render(); return; }
    if(action==="caixa-mov-cancelar"){ state.modal=null; render(); return; }
    if(action==="caixa-mov-confirmar"){
      var valor = Math.round(parseFloat(document.getElementById("movValorInput").value||"0")*100);
      var motivo = document.getElementById("movMotivoInput").value.trim();
      if(valor>0 && motivo) registrarMovimento(el.dataset.tipo, valor, motivo);
      return;
    }
    if(action==="caixa-fechar-abrir"){ state.modal={type:"caixaFechar", stage:"contar", informados:{}}; render(); return; }
    if(action==="caixa-fechar-cancelar"){ state.modal=null; render(); return; }
    if(action==="caixa-fechar-informar"){
      var inputs = document.querySelectorAll('[data-action="fechar-informado"]');
      var informados = {};
      inputs.forEach(function(inp){ informados[inp.dataset.forma] = Math.round(parseFloat(inp.value||"0")*100); });
      state.modal.informados = informados;
      state.modal.stage = "resultado";
      render(); return;
    }
    if(action==="caixa-fechar-justificar-confirmar"){
      var just = document.getElementById("justificativaInput").value.trim();
      if(just) confirmarFechamento(just);
      return;
    }
    if(action==="caixa-fechar-confirmar-final"){ confirmarFechamento(null); return; }

    if(action==="cardapio-filtro"){ state.cardapioFiltro = el.dataset.f; render(); return; }
    if(action==="produto-novo"){ abrirProdutoForm(null); return; }
    if(action==="produto-editar"){ abrirProdutoForm(el.dataset.produto); return; }
    if(action==="produto-esgotar"){ toggleEsgotado(el.dataset.produto); return; }
    if(action==="produto-form-cancelar"){ state.modal=null; render(); return; }
    if(action==="produto-form-salvar"){
      var novaCat = document.getElementById("pfNovaCategoria").value.trim();
      var categoria = novaCat || document.getElementById("pfCategoria").value;
      var nome = document.getElementById("pfNome").value;
      var preco = Math.round(parseFloat(document.getElementById("pfPreco").value||"0")*100);
      salvarProduto(el.dataset.produto||null, nome, categoria, preco);
      return;
    }

    if(action==="insumo-mov-abrir"){ abrirInsumoMov(el.dataset.tipo, el.dataset.insumo); return; }
    if(action==="insumo-mov-cancelar"){ state.modal=null; render(); return; }
    if(action==="insumo-mov-confirmar"){
      var insumoId = document.getElementById("imInsumo").value;
      var qtd = parseFloat(document.getElementById("imQuantidade").value||"0");
      var motivo = document.getElementById("imMotivo").value;
      confirmarInsumoMov(el.dataset.tipo, insumoId, qtd, motivo);
      return;
    }

    if(action==="financeiro-filtro"){ state.financeiroFiltro = el.dataset.f; render(); return; }
    if(action==="conta-nova"){ abrirContaForm(); return; }
    if(action==="conta-form-cancelar"){ state.modal=null; render(); return; }
    if(action==="conta-form-salvar"){
      var tipo = document.getElementById("cfTipo").value;
      var descricao = document.getElementById("cfDescricao").value;
      var categoria2 = document.getElementById("cfCategoria").value;
      var valor = Math.round(parseFloat(document.getElementById("cfValor").value||"0")*100);
      var vencimento = document.getElementById("cfVencimento").value;
      salvarConta(tipo, descricao, categoria2, valor, vencimento);
      return;
    }
    if(action==="conta-pagar"){ marcarContaPaga(el.dataset.conta); return; }

    if(action==="relatorio-periodo"){ state.relatorioPeriodo = el.dataset.p; render(); return; }

    if(action==="usuario-novo"){ abrirUsuarioForm(); return; }
    if(action==="usuario-form-cancelar"){ state.modal=null; render(); return; }
    if(action==="usuario-form-salvar"){
      var uNome = document.getElementById("ufNome").value;
      var uPapel = document.getElementById("ufPapel").value;
      var uPin = document.getElementById("ufPin").value;
      salvarUsuario(uNome, uPapel, uPin);
      return;
    }
    if(action==="usuario-toggle-ativo"){ toggleUsuarioAtivo(el.dataset.usuario); return; }

    if(action==="config-salvar"){
      salvarConfig(
        document.getElementById("cfgNome").value,
        document.getElementById("cfgCnpj").value,
        parseFloat(document.getElementById("cfgTaxa").value||"0"),
        parseFloat(document.getElementById("cfgDesconto").value||"0"),
        Math.round(parseFloat(document.getElementById("cfgDiferenca").value||"0")*100)
      );
      return;
    }
  };

  app.onchange = function(e){
    if(e.target.dataset.action==="toggle-taxa"){
      var comanda = state.comandas.find(function(c){ return c.id===state.viewParams.comandaId; });
      comanda.taxaServicoAtiva = e.target.checked;
      save(); render();
    }
  };

  app.oninput = function(e){
    var action = e.target.dataset.action;
    if(action==="draft-busca"){ state.draft.busca = e.target.value; render(); return; }
    if(action==="draft-obs"){ draftObs(e.target.dataset.produto, e.target.value); return; }
    if(action==="cancelar-motivo"){ state.modal.motivo = e.target.value; return; }
    if(action==="pagamento-valor"){
      var idx = parseInt(e.target.dataset.idx,10);
      pagamentoEditarLinha(idx, Math.round(parseFloat(e.target.value||"0")*100));
      render();
      return;
    }
  };

  app.ondragstart = function(e){
    var card = e.target.closest(".kanban-card");
    if(!card) return;
    card.classList.add("dragging");
    e.dataTransfer.setData("text/plain", JSON.stringify({comandaId:card.dataset.comanda, itemId:card.dataset.item}));
    e.dataTransfer.effectAllowed = "move";
  };
  app.ondragend = function(e){
    var card = e.target.closest(".kanban-card");
    if(card) card.classList.remove("dragging");
  };
  app.ondragover = function(e){
    var col = e.target.closest(".kanban-col");
    if(!col) return;
    e.preventDefault();
    col.classList.add("drag-over");
  };
  app.ondragleave = function(e){
    var col = e.target.closest(".kanban-col");
    if(col) col.classList.remove("drag-over");
  };
  app.ondrop = function(e){
    var col = e.target.closest(".kanban-col");
    if(!col) return;
    e.preventDefault();
    col.classList.remove("drag-over");
    try{
      var data = JSON.parse(e.dataTransfer.getData("text/plain"));
      if(can(PERM.ITEM_STATUS)) kdsSetStatus(data.comandaId, data.itemId, col.dataset.status);
    }catch(err){}
  };
}

document.addEventListener("keydown", function(e){
  if(!state || !state.usuarioAtualId) return;
  if(e.key==="Escape" && state.modal){ state.modal=null; render(); return; }
  if(e.key==="F8" && state.view==="caixa" && can(PERM.SANGRIA) && state.caixaSessao && state.caixaSessao.status==="ABERTA" && !state.modal){
    e.preventDefault(); state.modal={type:"caixaMov", tipo:"SANGRIA"}; render();
  }
});

state = load();
render();
})();
</script>
</body>
</html>
