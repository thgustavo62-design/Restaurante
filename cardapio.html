<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio</title>
<link rel="icon" type="image/png" href="assets/logo/rancho-netto-white-bg.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --background:#050506; --surface-01:#0B0C0E; --surface-02:#0E0F12; --border:#24262B;
  --text-primary:#EAF2FF; --text-muted:#7F95B3;
  --primary:#1E8BFF; --danger:#EF4444; --success:#22C55E;
  --font-display:'Exo 2','Oswald','Arial Narrow',sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; color:var(--text-primary); font-family:var(--font-body); padding:16px 16px 48px;
  background:
    radial-gradient(ellipse 900px 600px at 0% 0%, rgba(30,139,255,.10), transparent 60%),
    var(--background);
  background-attachment:fixed;
}
h1,h2{font-family:var(--font-display); margin:0; letter-spacing:.3px;}
.cp-header{text-align:center; padding:24px 0 12px;}
.cp-header h1{font-size:28px; font-weight:800;}
.cp-header p{margin:4px 0 0; color:var(--text-muted); font-size:12px; text-transform:uppercase; letter-spacing:1.5px;}
.cp-banner{max-width:640px; margin:0 auto 20px; background:linear-gradient(160deg, var(--surface-01), var(--surface-02)); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px;}
.cp-banner-texto{font-weight:700; font-size:14px; text-align:center;}
.cp-banner-produto{display:flex; align-items:center; gap:10px;}
.cp-banner-produto img{width:56px; height:56px; object-fit:cover; border-radius:8px; flex:0 0 auto;}
.cp-banner-produto-nome{font-weight:700; font-size:13px;}
.cp-banner-produto-preco{font-family:var(--font-display); font-weight:800; color:var(--primary); font-size:14px;}
.cp-categoria{max-width:640px; margin:0 auto 28px;}
.cp-categoria h2{font-size:16px; font-weight:800; text-transform:uppercase; letter-spacing:1px; color:var(--primary); border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:12px;}
.cp-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;}
.cp-item{background:var(--surface-01); border:1px solid var(--border); border-radius:8px; padding:12px; text-align:left; display:flex; flex-direction:column;}
.cp-item.cp-esgotado{opacity:.45;}
.cp-thumb{width:100%; height:80px; object-fit:cover; border-radius:6px; margin-bottom:8px; display:block;}
.cp-item-nome{font-size:13px; font-weight:600; line-height:1.3; min-height:34px;}
.cp-item-preco{font-family:var(--font-display); font-size:18px; font-weight:800; color:var(--primary); margin-top:8px;}
.cp-esgotado-label{color:var(--danger); font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:.5px;}
.cp-opcoes-grupo{font-size:10.5px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
.cp-opcoes-info{font-size:10.5px; color:var(--primary); margin-top:6px; font-weight:600;}
.cp-erro{max-width:480px; margin:60px auto; text-align:center; color:var(--text-muted); font-size:14px;}
.cp-footer-marca{text-align:center; margin-top:28px; font-size:10.5px; color:var(--text-muted); letter-spacing:.3px;}

/* Fase 5 — cardápio completo: busca + navegação por categoria */
.cp-topo{max-width:640px; margin:0 auto 16px; position:sticky; top:0; z-index:40; background:var(--background); padding-top:6px;}
.cp-search{display:flex; align-items:center; gap:8px; background:var(--surface-01); border:1px solid var(--border); border-radius:999px; padding:9px 14px; margin-bottom:10px;}
.cp-search input{flex:1; background:transparent; border:none; outline:none; color:var(--text-primary); font-size:13px; font-family:var(--font-body);}
.cp-search input::placeholder{color:var(--text-muted);}
.cp-nav-categorias{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none;}
.cp-nav-categorias::-webkit-scrollbar{display:none;}
.cp-nav-cat-item{flex:0 0 auto; background:var(--surface-01); border:1px solid var(--border); border-radius:999px; padding:7px 14px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; color:var(--text-muted); white-space:nowrap; cursor:pointer;}
.cp-nav-cat-item.active{background:var(--primary); border-color:var(--primary); color:#fff;}

/* Fase 3.3 — pedido pelo QR da mesa */
.cp-qty-ctrl{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:10px;}
.cp-qty-btn{width:30px; height:30px; border-radius:6px; border:1px solid var(--border); background:var(--surface-01); color:var(--text-primary); font-size:16px; cursor:pointer;}
#cp-barra-pedido{display:none; position:fixed; left:0; right:0; bottom:0; background:var(--primary); color:#fff; padding:14px 18px; align-items:center; justify-content:space-between; font-weight:700; z-index:50;}
.cp-btn-pedido{background:#fff; color:var(--primary); border:none; border-radius:999px; padding:9px 18px; font-weight:800; cursor:pointer;}
.cp-btn-secundario{background:transparent; color:var(--text-primary); border:1px solid var(--border); border-radius:999px; padding:9px 18px; font-weight:700; cursor:pointer;}
#cp-overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); align-items:flex-end; justify-content:center; z-index:60;}
.cp-modal{background:var(--surface-01); border:1px solid var(--border); border-radius:14px 14px 0 0; padding:20px; width:100%; max-width:480px; max-height:80vh; overflow-y:auto;}
.cp-modal-linha{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;}
.cp-modal-total{font-weight:800; font-size:15px; border-bottom:none;}
.cp-modal textarea{width:100%; margin-top:12px; background:var(--background); border:1px solid var(--border); border-radius:8px; color:var(--text-primary); padding:10px; font-family:var(--font-body); min-height:60px;}
.cp-modal-acoes{display:flex; gap:10px; margin-top:14px;}
.cp-modal-acoes button{flex:1;}
.cp-erro-inline{color:var(--danger); font-size:12px; margin-top:8px; min-height:14px;}
.cp-btn-opcoes{width:100%; margin-top:10px; background:var(--primary); color:#fff; border:none; border-radius:8px; padding:9px; font-weight:700; font-size:12.5px; cursor:pointer;}
.cp-modal-foto{width:100%; height:140px; object-fit:cover; border-radius:10px; margin-bottom:12px;}
.cp-opcoes-bloco{margin-bottom:16px;}
.cp-opcoes-titulo{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.cp-tag-obrig{background:rgba(239,68,68,.15); color:var(--danger); font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px; text-transform:none; letter-spacing:0;}
.cp-tag-opc{background:rgba(127,149,179,.15); color:var(--text-muted); font-size:9.5px; font-weight:700; padding:2px 7px; border-radius:999px; text-transform:none; letter-spacing:0;}
.cp-opcoes-regra{margin-left:auto; font-size:10px; color:var(--text-muted); font-weight:500; text-transform:none; letter-spacing:0;}
.cp-opcao-linha{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer;}
.cp-opcao-linha:last-child{border-bottom:none;}
.cp-opcao-linha input{width:17px; height:17px; flex:0 0 auto; accent-color:var(--primary);}
.cp-linha-cabecalho{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.cp-linha-opcoes{font-size:10.5px; color:var(--text-muted); margin-top:2px;}
.cp-linha-acoes{display:flex; align-items:center; gap:10px; margin-top:6px;}
.cp-linha-remover{background:none; border:none; color:var(--danger); font-size:11px; font-weight:700; cursor:pointer; padding:0;}
</style>
</head>
<body>
<div id="cp-root">
  <div class="cp-erro">Carregando cardápio...</div>
</div>
<div id="cp-barra-pedido"></div>
<div id="cp-overlay"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/cardapio-publico.js"></script>
</body>
</html>
